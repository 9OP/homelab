networks:
  homelab:
    driver: bridge

volumes:
  jellyfin_data:
    driver: local
  prowlarr_config:
    driver: local
  radarr_config:
    driver: local
  sonarr_config:
    driver: local
  qbittorrent_config:
    driver: local
  bazarr_config:
    driver: local

services:
  # Reverse proxy and web server
  # Handles HTTPS certificates and routes traffic to internal services
  # Access: http://torrent.vestige.internal, http://prowlarr.vestige.internal, etc.
  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./certs:/certs:ro
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE

  # DNS server for custom internal domain resolution
  # Resolves *.vestige.internal domains to Tailscale IP
  # Used by Tailscale split DNS configuration
  dnsmasq:
    image: tobi312/tools:dnsmasq
    container_name: dnsmasq
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      DNSMASQ_USER: root
    volumes:
      - ./configs/dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID

  # Web-based file manager for browsing and managing server files
  # Access all storage, uploads, downloads, and media files via browser
  # Access: http://files.vestige.internal
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
      FB_NOAUTH: "true"
    volumes:
      - /mnt/storage:/srv
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

  # BitTorrent client for downloading torrents
  # Downloads files sent by Radarr/Sonarr to /mnt/storage/downloads
  # Access: http://torrent.vestige.internal
  qbittorrent:
    image: linuxserver/qbittorrent:5.0.0
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
      WEBUI_PORT: 8080
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      - /mnt/storage/downloads:/downloads
    networks: [homelab]
    security_opt:
      - no-new-privileges:true

  # Media server for streaming movies and TV shows
  # Reads media from /mnt/storage/media (movies and tv folders)
  # Access: https://media.vestige-lab.xyz (public) or internal via Tailscale
  jellyfin:
    image: linuxserver/jellyfin:10.10.3
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - jellyfin_data:/config
      - /mnt/storage/media:/media
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # Indexer manager for torrent sites
  # Manages torrent indexers/trackers and syncs them to Radarr/Sonarr
  # Searches across multiple indexers for releases
  # Access: http://prowlarr.vestige.internal
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - prowlarr_config:/config
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # Movie collection manager
  # Automatically searches, downloads, and organizes movies
  # Sends torrents to qBittorrent and moves completed files to /mnt/storage/media/movies
  # Access: http://radarr.vestige.internal
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - radarr_config:/config
      - /mnt/storage/media/movies:/movies
      - /mnt/storage/downloads:/downloads
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # TV show collection manager
  # Automatically searches, downloads, and organizes TV series
  # Sends torrents to qBittorrent and moves completed files to /mnt/storage/media/tv
  # Access: http://sonarr.vestige.internal
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - sonarr_config:/config
      - /mnt/storage/media/tv:/tv
      - /mnt/storage/downloads:/downloads
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # Subtitle manager for movies and TV shows
  # Automatically downloads subtitles for media in Radarr and Sonarr
  # Integrates with multiple subtitle providers (OpenSubtitles, etc.)
  # Access: http://bazarr.vestige.internal
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - bazarr_config:/config
      - /mnt/storage/media/movies:/movies
      - /mnt/storage/media/tv:/tv
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # Personal budget tracking app
  # Access: http://budget.vestige.internal
  budget:
    image: ghcr.io/9op/budget:latest
    container_name: budget
    restart: unless-stopped
    env_file: .env
    networks: [homelab]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Polls registries hourly and restarts containers when new images are available
  # Requires GHCR credentials in /root/.docker/config.json (docker login ghcr.io)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: "3600"
      WATCHTOWER_CLEANUP: "true"
      DOCKER_CONFIG: /config.json
      DOCKER_API_VERSION: "1.54"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
